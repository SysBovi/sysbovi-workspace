version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: sysbovi_postgres
    environment:
      POSTGRES_USER: sysbovi_user
      POSTGRES_PASSWORD: sysbovi_password
      POSTGRES_DB: sysbovi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sysbovi_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
